.sub{color:var(--ink2);margin:0 0 16px;line-height:1.5}

 $("people").innerHTML=`<div class="people">${counts.map(c=>Array(Math.max(c.n,0)).fill(`<span style="background:${PC[c.p]}" title="${c.p}"></span>`).join("")).join("")}</div>`+
  `<div class="legend-dots">${counts.map(c=>`<span><i style="background:${PC[c.p]}"></i>${SH[c.p]} ${c.n}</span>`).join("")}</div>`;
 $("clock").innerHTML=M.provinces.map(p=>{const d=(p.pop_2023-p.pop_2017)/6/365;return `<div class="stat"><span>${EMO[p.province]} ${SH[p.province]}</span><b>+${fmtN(d)} people</b></div><div class="lbar"><i style="width:${d/perDay*100}%;background:${PC[p.province]}"></i></div>`;}).join("");
 $("fastest").innerHTML=sortBy(D,"growth_rate").slice(0,6).map((r,i)=>`<div class="stat"><span>${i+1}. ${r.district} <span style="color:${PC[r.province]}">●</span> ${SH[r.province]}</span><b>${r.growth_rate.toFixed(2)}%/yr</b></div>`).join("");
 $("bub-sel").onchange=bubbles;bubbles();
}
function bubbles(){const k=$("bub-sel").value,svg=d3.select("#bubblemap"),W=svg.node().clientWidth||700,H=560;svg.attr("viewBox",`0 0 ${W} ${H}`);svg.selectAll("*").remove();
 const pr=d3.geoMercator().fitExtent([[10,10],[W-10,H-10]],PROV),path=d3.geoPath(pr);
 svg.append("g").selectAll("path").data(PROV.features).join("path").attr("d",path).attr("fill",d=>d.properties.in_census?(PC[d.properties.province]+"1f"):"#e2e8f0").attr("stroke",d=>PC[d.properties.province]||"#cbd5e1").attr("stroke-width",1.2);
 const rs=d3.scaleSqrt().domain([0,d3.max(D,r=>r.pop_2023)]).range([0,34]);
 let col,leg;
 if(k==="province"){col=r=>PC[r.province];leg=Object.keys(PC).map(p=>`<span><i style="background:${PC[p]}"></i>${SH[p]}</span>`).join("");}
 else{const vals=D.map(r=>r[k]),ext=k==="growth_rate"?[0.5,5]:d3.extent(vals);const sc=d3.scaleSequential(d3.interpolatePlasma).domain([ext[1],ext[0]]);col=r=>sc(Math.max(ext[0],Math.min(ext[1],r[k])));
  leg=`<span>${IND[k][0]}:</span>`+[0,.25,.5,.75,1].map(t=>{const v=ext[0]+t*(ext[1]-ext[0]);return `<span><i style="background:${sc(v)}"></i>${IND[k][1](v)}</span>`;}).join("");}
 const tip=d3.select("body").selectAll("div.btip").data([0]).join("div").attr("class","btip gtip").style("position","fixed");
 svg.append("g").selectAll("circle").data([...D].filter(r=>r.lon!=null).sort((a,b)=>b.pop_2023-a.pop_2023)).join("circle").attr("cx",r=>pr([r.lon,r.lat])[0]).attr("cy",r=>pr([r.lon,r.lat])[1]).attr("r",0)
  .attr("fill",col).attr("fill-opacity",.82).attr("stroke","#fff").attr("stroke-width",1.2)
  .on("mousemove",(e,r)=>tip.style("display","block").style("left",e.clientX+12+"px").style("top",e.clientY+12+"px").html(`<b>${r.district}</b> · ${SH[r.province]}<br>${fmtN(r.pop_2023)} people<br>Growth ${r.growth_rate.toFixed(2)}% · Urban ${r.urban_pct.toFixed(1)}% · Literacy ${r.literacy_rate.toFixed(1)}%`))
  .on("mouseleave",()=>tip.style("display","none"))
  .transition().duration(900).delay((r,i)=>i*6).attr("r",r=>Math.max(2.5,rs(r.pop_2023)));
 $("bub-legend").innerHTML=leg;}


infographics();
</script></body></html>
